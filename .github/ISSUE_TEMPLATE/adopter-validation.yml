name: Adopter validation
description: Share privacy-safe integration, coverage, and precision evidence
title: "[adopter] "
labels:
  - adopter-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing DataPR. Share only aggregates you are authorized to disclose. Do not attach manifests, SQL, samples, credentials, or proprietary identifiers.
  - type: input
    id: datapr-version
    attributes:
      label: DataPR version
      placeholder: v1.0.0rc1, v0.5.0, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: dbt adapter
      options:
        - BigQuery
        - Snowflake
        - Spark or Databricks
        - Postgres
        - DuckDB
        - Another adapter
    validations:
      required: true
  - type: input
    id: first-report
    attributes:
      label: Time to first report
      description: End-to-end wall-clock minutes from starting integration to the first understandable report.
      placeholder: 12 minutes
  - type: input
    id: analysis-seconds
    attributes:
      label: DataPR analysis seconds
      description: The analysis_seconds value from datapr measure.
      placeholder: "2.4"
  - type: input
    id: project-scale
    attributes:
      label: Aggregate project scale
      description: Model counts only; do not include model names.
      placeholder: 850 base models, 853 head models, 7 changed
  - type: textarea
    id: coverage
    attributes:
      label: Coverage aggregates
      description: Complete or incomplete plus parse, missing-SQL, missing-profile, and lineage counts.
      placeholder: complete=true; parsed failures=0; missing SQL=0; lineage models=7
  - type: textarea
    id: precision
    attributes:
      label: High-severity review aggregates
      description: Counts reviewed, actionable or correct, false positive, and unassessed.
      placeholder: reviewed=5; correct=4; false_positive=1; unassessed=0
  - type: textarea
    id: friction
    attributes:
      label: Integration friction and missing evidence
      description: Describe the workflow problem without proprietary identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this submission and removed manifests, SQL, samples, credentials, paths, and proprietary identifiers.
          required: true
