name: Feature proposal
description: Propose an evidence-backed pull-request review capability
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Review-time problem
      description: What decision is difficult today, and who makes it?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Adoption evidence
      description: Describe frequency and impact using non-sensitive aggregates or a synthetic example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, evidence, failure modes, and the desired report behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This improves a pull-request decision rather than proposing a general catalog or observability platform.
          required: true
        - label: I can help validate the behavior on a synthetic or authorized project.
          required: false
