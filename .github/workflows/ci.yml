name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable .
      - run: python -m unittest discover -s tests -v
      - run: datapr doctor tests/fixtures/head_manifest.json
      - run: datapr compare --base-manifest tests/fixtures/base_manifest.json --head-manifest tests/fixtures/head_manifest.json --format json
      - run: python -m json.tool schemas/result-v1.schema.json >/dev/null

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: datapr
        with:
          base-manifest: tests/fixtures/base_manifest.json
          head-manifest: tests/fixtures/head_manifest.json
          enforce: "false"
      - name: Verify report
        env:
          REPORT_PATH: ${{ steps.datapr.outputs.report-path }}
        run: test -n "$REPORT_PATH" && test -f "$REPORT_PATH"
