name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - run: python -m pip install --editable .
      - run: python -m unittest discover -s tests -v
      - run: datapr doctor tests/fixtures/head_manifest.json
      - run: datapr compare --base-manifest tests/fixtures/base_manifest.json --head-manifest tests/fixtures/head_manifest.json --format json
      - run: datapr measure --base-manifest tests/fixtures/base_manifest.json --head-manifest tests/fixtures/head_manifest.json
      - run: python -m json.tool schemas/result-v1.schema.json >/dev/null
      - run: python -m json.tool schemas/measurement-v1.schema.json >/dev/null

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: datapr
        with:
          base-manifest: tests/fixtures/base_manifest.json
          head-manifest: tests/fixtures/head_manifest.json
          enforce: "false"
      - name: Verify report
        env:
          REPORT_PATH: ${{ steps.datapr.outputs.report-path }}
        run: test -n "$REPORT_PATH" && test -f "$REPORT_PATH"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release metadata
        run: python scripts/verify_release.py
      - name: Build and inspect distributions
        run: |
          python -m pip install \
            "build>=1.2,<2" \
            "twine>=5,<8" \
            "check-jsonschema>=0.31,<1"
          python -m build
          python -m twine check dist/*
          check-jsonschema \
            --schemafile schemas/config-v1.schema.json \
            datapr.example.yml \
            examples/synthetic_partners/*/datapr.yml
      - name: Install and execute wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          datapr --version
          datapr doctor tests/fixtures/head_manifest.json
      - name: Rehearse v0.5 upgrade and rollback
        run: python scripts/rehearse_upgrade.py --candidate-wheel dist/*.whl
