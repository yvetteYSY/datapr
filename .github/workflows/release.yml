name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release metadata
        run: python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
      - name: Build and inspect distributions
        run: |
          python -m pip install "build>=1.2,<2" "twine>=5,<8"
          python -m build
          python -m twine check dist/*
      - name: Test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          datapr --version
          datapr doctor tests/fixtures/head_manifest.json
      - name: Rehearse v0.5 upgrade and rollback
        run: python scripts/rehearse_upgrade.py --candidate-wheel dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release from exact semantic tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "DataPR $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "${release_flags[@]}"
