version: 1

execution:
  sample_rows: 100000
  # Deterministic across input row order. Use "first" for v0.1 behavior.
  sample_strategy: hash
  # Change the seed to obtain a different reproducible sample.
  sample_seed: 0
  # Optional directories containing <model>.parquet, <model>.csv, or <model>.json.
  # base_data_dir: .datapr/base
  # head_data_dir: .datapr/head

policies:
  fail_on:
    - model.removed
    - schema.removed_column
    - schema.incompatible_type_change
  warn_on:
    - model.modified
    - performance.filter_removed
    - performance.cross_join_added
    - performance.select_star_added
  downstream_models: 10
  row_count_change_percent: 5
  null_rate_change_percent: 5
  distribution_change_percent: 10
  fail_on_incomplete_coverage: false
