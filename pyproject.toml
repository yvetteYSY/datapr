[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "datapr"
version = "1.0.0rc1"
description = "Pull-request impact analysis for SQL and dbt"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DataPR contributors" }]
dependencies = [
  "duckdb>=1.1,<2",
  "PyYAML>=6.0,<7",
  "sqlglot>=30,<31",
]
keywords = ["dbt", "data-engineering", "lineage", "ci", "data-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yvetteYSY/datapr"
Documentation = "https://github.com/yvetteYSY/datapr#readme"
Issues = "https://github.com/yvetteYSY/datapr/issues"
Changelog = "https://github.com/yvetteYSY/datapr/blob/main/CHANGELOG.md"

[project.scripts]
datapr = "datapr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datapr"]
